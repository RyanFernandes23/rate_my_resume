[project]
name = "rate-my-resume-backend"
version = "0.1.0"
description = "FastAPI backend for the Rate My Resume app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "langchain>=1.2.15",
    "langchain-core",
    "langchain-openrouter",
    "openrouter>=0.9.1",
    "pydantic[email]==2.11.3",
    "pymupdf==1.26.6",
    "pymupdf4llm>=0.0.27",
    "python-docx>=1.2.0",
    "docx2pdf>=0.1.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
    "uvicorn==0.32.0",
    "langchain-groq>=1.1.2",
    "langchain-openai>=0.3.0",
    "supabase>=2.9.0",
    "razorpay>=1.4.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.28.0",
    "email-validator>=2.3.0",
    "gotrue>=2.12.4",
    "tenacity>=9.1.4",
    "langchain-cloudflare>=0.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.uv]
package = false
