[project]
name = "rate-my-resume-backend"
version = "0.1.0"
description = "FastAPI backend for the Rate My Resume app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "docling==2.88.0",
    "fastapi==0.115.0",
    "langchain-core",
    "langchain-openrouter",
    "pydantic==2.11.3",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
    "uvicorn==0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.uv]
package = false
